<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tech Mastery</title>
  <style>
    /* ===== Global Styles ===== */
    body {
      font-family: "Inter", "Segoe UI", Tahoma, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px 40px;
      color: #1f2937;
    }

    /* ===== Header ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .track-btn {
      background: linear-gradient(90deg, #10b981, #3b82f6);
      border: none;
      padding: 12px 30px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .track-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    /* ===== Progress Bar ===== */
    .progress-container {
      margin: 25px 0;
      background: #e0e7ff;
      border-radius: 20px;
      overflow: hidden;
      height: 20px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.08);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      width: 0%;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    /* ===== Table ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 14px 18px;
      text-align: center;
      font-size: 15px;
      transition: all 0.2s;
    }

    th {
      background: #6366f1;
      color: #fff;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.7px;
    }

    tr:nth-child(even) {
      background: #f9fafb;
    }

    tr:hover {
      background: #e0e7ff;
    }

    /* ===== Add Section ===== */
    .add-section {
      margin-top: 25px;
      display: flex;
      gap: 14px;
    }

    .add-section input {
      flex: 1;
      padding: 14px;
      border: 2px solid #6366f1;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      transition: border 0.3s, box-shadow 0.3s;
    }
    .add-section input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 10px rgba(99,102,241,0.3);
    }

    .add-section button {
      padding: 14px 26px;
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .add-section button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* ===== Status Labels ===== */
    .status {
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: 600;
      color: #fff;
      display: inline-block;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .status:hover { transform: scale(1.05); }

    .not-started { background: #6b7280; }
    .in-progress { background: #f59e0b; }
    .done { background: #10b981; }

    /* ===== Links ===== */
    a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    a:hover {
      color: #3730a3;
      text-decoration: underline;
    }

    /* ===== Delete Button ===== */
    .delete-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .delete-btn:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Tech Mastery</h1>
    <button class="track-btn">Track & Time</button>
  </header>

  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <table id="taskTable">
    <thead>
      <tr>
        <th>S.No</th>
        <th>Techs</th>
        <th>Status</th>
        <th>Workspace</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="add-section">
    <input type="text" id="newTech" placeholder="Enter new tech mastery task...">
    <button onclick="addTask()">Add</button>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("techTasks")) || [];

    function renderTasks() {
      const tbody = document.querySelector("#taskTable tbody");
      tbody.innerHTML = "";

      let doneCount = 0;

      tasks.forEach((task, index) => {
        const row = document.createElement("tr");

        let statusClass = "not-started";
        if (task.status === "In Progress") statusClass = "in-progress";
        if (task.status === "Done") {
          statusClass = "done";
          doneCount++;
        }

        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${task.tech}</td>
          <td><span class="status ${statusClass}">${task.status}</span></td>
          <td><a href="workspace.html?id=${task.id}" target="_blank">Open</a></td>
          <td><button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button></td>
        `;

        tbody.appendChild(row);
      });

      localStorage.setItem("techTasks", JSON.stringify(tasks));

      const percent = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;
      document.getElementById("progressBar").style.width = percent + "%";
    }

    function addTask() {
      const newTechInput = document.getElementById("newTech");
      const tech = newTechInput.value.trim();
      if (!tech) return;
      tasks.push({ id: Date.now(), tech: tech, status: "Not Started" });
      newTechInput.value = "";
      renderTasks();
    }

    function deleteTask(id) {
      if (confirm("⚠️ Are you sure you want to delete this task?")) {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
      }
    }

    renderTasks();
  </script>

</body>
</html>
